name: CI/CD Test, Cloud Build & Raspberry Pi Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  # Job 1: Test every test case & verify builds before any deployment
  test:
    name: Run Tests, Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install & Test Server
        run: |
          cd server
          npm ci
          npx prisma generate
          npm test
          npm run type-check

      - name: Install & Validate Client
        run: |
          cd client
          npm ci
          npm run lint
          npm run build

  # Job 2: Build ARM64 Docker images in GitHub Cloud & Push to GHCR
  build-and-push:
    name: Build & Push Docker Images (GHCR Cloud)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/ecommerce-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          tags: ghcr.io/${{ env.REPO_OWNER }}/ecommerce-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: Fast Auto-Deploy on Raspberry Pi
  deploy-pi:
    name: Auto Deploy to Raspberry Pi (5-Sec Pull)
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Pull Pre-built Images & Restart Containers
        run: |
          TARGET_DIR="/srv/dev-disk-by-uuid-168E23328E2309B7/code/project/Ecommerce"
          if [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
          else
            cd ~/Ecommerce_docker || cd ~/Ecommerce
          fi
          git fetch origin main
          git reset --hard origin/main
          docker compose pull
          docker compose up -d
          docker image prune -f
          find ~/actions-runner/_diag -type f -mtime +2 -delete 2>/dev/null || true
