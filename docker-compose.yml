services:
  mysql:
    image: mysql:8.0
    container_name: ecom_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootpassword}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-ecomdb}"
      MYSQL_USER: "${MYSQL_USER:-ecomuser}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-ecompass}"
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ecom_server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: "${NODE_ENV:-production}"
      DATABASE_URL: "${DATABASE_URL:-mysql://ecomuser:ecompass@mysql:3306/ecomdb}"
      JWT_SECRET: "${JWT_SECRET:-super_secret_jwt_key_production_pi}"
      REFRESH_SECRET: "${REFRESH_SECRET:-super_secret_refresh_key_production_pi}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-sk_test_placeholder}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:-placeholder}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:-placeholder}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:-placeholder}"
      CLIENT_URL: "${CLIENT_URL:-https://ecom.pongsatorn.dev}"
    ports:
      - "5050:5000"
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-/api}"
        VITE_STRIPE_PUBLISHABLE_KEY: "${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}"
    container_name: ecom_client
    restart: always
    ports:
      - "8088:80"
    depends_on:
      - server

volumes:
  mysql_data:
